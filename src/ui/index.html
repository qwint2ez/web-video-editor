<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QWINT's VIDEO EDITOR</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>
<body>
    <header>
        <h1>QWINT's VIDEO EDITOR</h1>
    </header>

    <!-- Initial upload section -->
    <div class="upload-section">
        <label for="videoInput" class="upload-btn">Upload Media</label>
        <input type="file" id="videoInput" accept="video/*, audio/*" multiple style="display: none;">
    </div>

    <p id="debug">Status: Waiting for video upload...</p>

    <!-- Video list section (hidden initially) -->
    <div id="uploadedVideosSection" class="hidden">
        <h3>Uploaded Media</h3>
        <ul id="uploadedMediaList"></ul>
        <button id="addToTimelineBtn" class="action-btn">Add Selected to Timeline</button>
    </div>

    <!-- Editor sections (hidden initially) -->
    <div class="editor-container hidden">
        <div class="video-player">
            <div class="video-container">
                <video id="processedVideo"></video>
                <div id="textOverlay"></div>
            </div>
            
            <div class="timeline-container" id="timelineContainer">
                <div id="timelineBar">
                    <!-- Segments will be added here by JS -->
                </div>
                <div class="timeline-controls">
                    <button id="playPauseBtn" class="player-btn">Play</button>
                    <span id="currentTime">00:00</span> / <span id="duration">00:00</span>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
                    <button id="downloadBtn" class="player-btn">Download</button>
                </div>
            </div>
        </div>

        <div class="editing-controls">
            <div class="controls">
                <h3>Trim</h3>
                <div class="trim-controls">
                    <input type="number" id="start" min="0" step="0.1" value="0" placeholder="Start">
                    <input type="number" id="end" min="0" step="0.1" value="0" placeholder="End">
                    <button id="applyTrimBtn">Apply Trim</button>
                </div>
            </div>

            <div class="controls">
                <h3>Text Overlay</h3>
                <input type="text" id="textInput" placeholder="Enter text">
                <select id="textPosition">
                    <option value="top-left">Top Left</option>
                    <option value="top-right">Top Right</option>
                    <option value="bottom-left">Bottom Left</option>
                    <option value="bottom-right">Bottom Right</option>
                </select>
                <input type="color" id="textColor" value="#ffffff">
                <select id="textSize">
                    <option value="16">Small (16px)</option>
                    <option value="24">Medium (24px)</option>
                    <option value="32">Large (32px)</option>
                </select>
                <button id="applyTextBtn">Apply Text</button>
            </div>

            <div class="controls">
                <h3>Filters</h3>
                <select id="filterSelect">
                    <option value="">Select Filter</option>
                    <option value="grayscale">Grayscale</option>
                    <option value="sepia">Sepia</option>
                    <option value="invert">Invert</option>
                </select>
                <button id="applyFilterBtn">Apply Filter</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
